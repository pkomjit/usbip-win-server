[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usbip-win-server"
version = "0.1.0"
description = "USBShare: USB/IP server for Windows - share USB devices over the LAN with usbip-win2 clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Poowit" }]
requires-python = ">=3.10"
dependencies = ["libusb1>=3.1", "pystray>=0.19", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/pkomjit/usbip-win-server"
Issues = "https://github.com/pkomjit/usbip-win-server/issues"

[project.scripts]
usbshare = "usbshare.__main__:main"

[tool.setuptools]
packages = ["usbshare"]
